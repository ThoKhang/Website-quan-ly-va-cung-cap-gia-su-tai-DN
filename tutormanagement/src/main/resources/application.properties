spring.application.name=tutormanagement
# ==============================================================
# CAU HINH H2 DATABASE (RENDER-FRIENDLY)
# ==============================================================
# Dung H2 o che do gia lap SQL Server, luu vao file 'data/db' de tranh mat du lieu
spring.datasource.url=jdbc:h2:file:./data/db;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=root123

# Tu dong chay file schema.sql de tao bang va du lieu
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# Neu bi loi trung lap khi restart, hay doi thanh 'never' sau lan chay dau tien
spring.sql.init.continue-on-error=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ==============================================================
# CAU HINH GUI MAIL OTP
# ==============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cau hinh file upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
