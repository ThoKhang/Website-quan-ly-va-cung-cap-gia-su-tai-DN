spring.application.name=tutormanagement
spring.config.import=optional:classpath:.env[.properties]
# ==============================================================
# C\u1ea4U H\u00ccNH K\u1ebeT N\u1ed0I C\u01a0 S\u1ede D\u1eee LI\u1ec6U SQL SERVER
# ==============================================================
# Thay "TenDatabaseCuaBan" b\u1eb1ng t\u00ean DB b\u1ea1n \u0111\u00e3 t\u1ea1o trong SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyCungCapGiaSuDN;encrypt=true;trustServerCertificate=true;
logging.level.org.springframework.config.import=TRACE
# T\u00e0i kho\u1ea3n v\u00e0 m\u1eadt kh\u1ea9u \u0111\u0103ng nh\u1eadp SQL Server (th\u01b0\u1eddng m\u1eb7c \u0111\u1ecbnh l\u00e0 sa)
spring.datasource.username=sa
spring.datasource.password=123
# B\u1eaft bu\u1ed9c khai b\u00e1o Driver cho SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================================================
# C\u1ea4U H\u00ccNH JPA & HIBERNATE (D\u00e0nh cho qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n)
# ==============================================================
# Hi\u1ec3n th\u1ecb c\u00e2u l\u1ec7nh SQL tr\u00ean console \u0111\u1ec3 d\u1ec5 debug
spring.jpa.show-sql=true

# \u0110\u1ecbnh d\u1ea1ng c\u00e2u l\u1ec7nh SQL cho \u0111\u1eb9p d\u1ec5 \u0111\u1ecdc
spring.jpa.properties.hibernate.format_sql=true

# Quan tr\u1ecdng: "update" gi\u00fap Spring Boot t\u1ef1 \u0111\u1ed9ng t\u1ea1o/c\u1eadp nh\u1eadt b\u1ea3ng d\u1ef1a tr\u00ean Entity. 
# (N\u1ebfu b\u1ea1n \u0111\u00e3 ch\u1ea1y file script SQL t\u1ea1o b\u1ea3ng tay r\u1ed3i th\u00ec c\u00f3 th\u1ec3 \u0111\u1ed5i th\u00e0nh "none")
spring.jpa.hibernate.ddl-auto=none
# Explicitly set dialect to avoid "Unable to determine Dialect" errors
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# \u00c9p Spring Boot gi\u1eef nguy\u00ean t\u00ean c\u1ed9t (CamelCase), KH\u00d4NG t\u1ef1 \u0111\u1ed9ng chuy\u1ec3n th\u00e0nh d\u1ea5u g\u1ea1ch d\u01b0\u1edbi
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# (T\u00f9y ch\u1ecdn) B\u1eadt t\u00ednh n\u0103ng in c\u00e2u l\u1ec7nh SQL ra Terminal \u0111\u1ec3 sau n\u00e0y d\u1ec5 b\u1eaft b\u1ec7nh
spring.jpa.show-sql=true


# ==============================================================
# C\u00e1\u00ba\u00a4U H\u00c3\u008cNH SERVER PORT
# ==============================================================
server.port=8080

# ==============================================================
# CAU HINH GUI MAIL OTP
# ==============================================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
app.mail.from=${MAIL_FROM:${spring.mail.username:}}
app.mail.otp.expire-minutes=${MAIL_OTP_EXPIRE_MINUTES:10}

# C\u1ea5u h\u00ecnh n\u00e2ng gi\u1edbi h\u1ea1n dung l\u01b0\u1ee3ng file upload (M\u1eb7c \u0111\u1ecbnh l\u00e0 1MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
